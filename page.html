<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LAD={4:25,9:31,21:42,28:56,51:72,71:91},SNK={97:78,62:19,54:34,88:67};
const QT=new Set();
const COL=['#ff6b8b','#4d9bff','#ffd23f','#8a6bff'];
const QS=[
["Tahun Jepang mulai menduduki Hindia Belanda (Indonesia)?","1942","1940","1945","1938"],
["Belanda menyerah kepada Jepang lewat perjanjian di…","Kalijati","Linggarjati","Renville","Roem-Royen"],
["Gerakan propaganda awal Jepang yang terkenal?","Gerakan Tiga A","Gerakan Empat Sehat","Politik Etis","Tanam Paksa"],
["Isi slogan Tiga A bagi Jepang?","Pelindung, Pemimpin, dan Cahaya Asia","Penjajah Asia","Sahabat Eropa","Pedagang Asia"],
["Tokoh yang memimpin Gerakan Tiga A?","Mr. Samsuddin","Soekarno","Moh. Hatta","Ki Hajar Dewantara"],
["PUTERA (1943) dipimpin oleh tokoh yang dijuluki…","Empat Serangkai","Tiga Serangkai","Lima Sekawan","Dwitunggal"],
["Anggota Empat Serangkai adalah…","Soekarno, Hatta, Ki Hajar Dewantara, K.H. Mas Mansyur","Soekarno, Hatta, Sjahrir, Tan Malaka","Hatta, Sjahrir, Soepomo, Yamin","Soekarno, Yamin, Soepomo, Radjiman"],
["Organisasi umat Islam bentukan Jepang tahun 1943?","Masyumi","Sarekat Islam","Muhammadiyah","Budi Utomo"],
["PETA singkatan dari…","Pembela Tanah Air","Perjuangan Tanah Air","Pasukan Tempur Angkatan","Pemuda Tentara Asia"],
["PETA dibentuk pada tahun…","1943","1942","1944","1945"],
["Prajurit pembantu Jepang dari kalangan pribumi disebut…","Heiho","Seinendan","Keibodan","Fujinkai"],
["Barisan pemuda bentukan Jepang untuk melatih pemuda?","Seinendan","Fujinkai","Heiho","Masyumi"],
["Organisasi wanita bentukan Jepang?","Fujinkai","Seinendan","Keibodan","Putera"],
["Keibodan adalah…","Barisan pembantu polisi","Organisasi wanita","Pasukan tempur","Pusat kebudayaan"],
["Romusha adalah…","Tenaga kerja paksa","Tentara sukarela","Polisi Jepang","Pegawai pemerintah"],
["Rel Saketi–Bayah dibangun romusha untuk melayani…","Tambang batu bara Bayah","Perkebunan teh","Pelabuhan Surabaya","Pabrik gula"],
["Seikerei adalah…","Penghormatan membungkuk ke arah Tokyo (Kaisar)","Latihan baris-berbaris","Kerja bakti","Rapat desa"],
["Tonarigumi mirip dengan…","Rukun Tetangga (RT)","Koperasi","Pasukan polisi","Sekolah"],
["Kinrohosi artinya…","Kerja bakti","Rapat desa","Pajak","Latihan militer"],
["Bahasa yang dilarang dipakai pada masa Jepang?","Bahasa Belanda","Bahasa Jepang","Bahasa Indonesia","Bahasa Daerah"],
["Kepala pemerintahan militer Jepang di Jawa disebut…","Gunseikan","Tenno","Shogun","Daimyo"],
["Wilayah Indonesia timur dikuasai oleh…","Angkatan Laut Jepang (Kaigun)","Angkatan Darat ke-16","Angkatan Darat ke-25","Polisi Militer"],
["Batavia diganti namanya menjadi…","Jakarta","Djayakarta","Nusantara","Betawi"],
["Pemimpin pemberontakan PETA di Blitar (1945)?","Supriyadi","Soedirman","Gatot Subroto","Oerip Soemohardjo"],
["Pemberontakan Singaparna (1944) dipimpin oleh…","K.H. Zainal Mustafa","Pangeran Diponegoro","Teuku Umar","Imam Bonjol"],
["Pemberontakan Cot Plieng (1942) terjadi di…","Aceh","Jawa Barat","Blitar","Makassar"],
["Pemberontakan petani Indramayu 1944 dipicu oleh…","Kewajiban menyerahkan padi","Larangan berdagang","Wajib militer","Pajak garam"],
["Perempuan yang dipaksa melayani tentara Jepang disebut…","Jugun ianfu","Fujinkai","Kunoichi","Geisha"],
["Dampak ekonomi besar masa Jepang?","Kelaparan akibat penyerahan hasil bumi paksa","Kemakmuran petani","Bebas pajak","Impor melimpah"],
["Jawa Hokokai dibentuk untuk menggantikan…","Putera","Masyumi","PETA","Heiho"],
["Pusat kebudayaan bentukan Jepang tahun 1943?","Keimin Bunka Shidosho","Balai Pustaka","Taman Siswa","Gunseikanbu"],
["PM Koiso menjanjikan kemerdekaan Indonesia pada…","7 September 1944","17 Agustus 1945","1 Maret 1945","8 Maret 1942"],
["BPUPKI dibentuk untuk…","Menyelidiki persiapan kemerdekaan","Melatih tentara","Mengumpulkan romusha","Menghapus pajak"],
["Ketua BPUPKI adalah…","Dr. K.R.T. Radjiman Wedyodiningrat","Soekarno","Moh. Hatta","Soepomo"],
["Soekarno berpidato tentang Pancasila pada…","1 Juni 1945","17 Agustus 1945","29 Mei 1945","22 Juni 1945"],
["PPKI (7 Agustus 1945) diketuai oleh…","Soekarno","Radjiman","Hatta","Soepomo"],
["Jepang menyerah kepada Sekutu pada…","15 Agustus 1945","8 Maret 1942","6 Agustus 1945","17 Agustus 1945"],
["Bom atom dijatuhkan Amerika di kota…","Hiroshima dan Nagasaki","Tokyo dan Osaka","Kyoto dan Nara","Yokohama dan Kobe"],
["Soekarno-Hatta dibawa golongan muda ke…","Rengasdengklok","Kalijati","Surabaya","Bandung"],
["Naskah proklamasi diketik oleh…","Sayuti Melik","Fatmawati","Sukarni","Ahmad Soebardjo"],
["Teks proklamasi dirumuskan di rumah…","Laksamana Maeda","Soekarno","Hatta","Sukarni"],
["Jepang menyerang Pearl Harbor pada…","7 Desember 1941","8 Maret 1942","1 Maret 1945","17 Agustus 1945"]];
let P=[],turn=0,mode='start',sc=2,ssel=0,bag=[],AC,qo=[],qsel=0,lock=false,qres,qp=0,sfx=true,mus=true;
const xy=n=>{const r=Math.floor((n-1)/10),k=(n-1)%10,c=r%2?9-k:k;return[c*10+5,(9-r)*10+5]};
const ctx=()=>{AC=AC||new AudioContext();AC.resume();return AC};
function snd(f,d=.12,t='sine'){if(!sfx)return;try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
// musik chiptune
const M=[12,null,16,null,19,16,14,null,14,null,19,null,16,14,12,null,16,null,12,null,9,12,16,null,12,null,14,null,9,null,12,null],R=[0,7,9,5];let mi=0,mt=null,nt=0,nb;
const mf=m=>440*2**((m-69)/12);
function tone(m,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=mf(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function hat(t,v){nb=nb||(()=>{const b=AC.createBuffer(1,2000,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<2000;i++)d[i]=Math.random()*2-1;return b})();const s=AC.createBufferSource(),g=AC.createGain();s.buffer=nb;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(g).connect(AC.destination);s.start(t)}
function sched(){while(nt<AC.currentTime+.3){const s=mi%32,b=s>>3,r=R[b],e=.2;
 if(M[s]!=null)tone(72+M[s],nt,e*1.7,'square',.03);
 if(s%2==0)tone(36+r,nt,e*1.8,'triangle',.13);else tone(60+r+[0,b==2?3:4,7][(s>>1)%3],nt,e*.8,'square',.014);
 hat(nt,s%2?.015:.035);nt+=e;mi++}}
function mOn(){if(!mus)return;ctx();if(!mt){nt=AC.currentTime+.1;mt=setInterval(sched,80)}}
function mOff(){clearInterval(mt);mt=null}
$('mb').onclick=()=>{mus=!mus;$('mb').classList.toggle('off',!mus);mus?mOn():mOff()};
$('sb').onclick=()=>{sfx=!sfx;$('sb').classList.toggle('off',!sfx)};
// papan
const g=$('grid');
for(let r=9;r>=0;r--)for(let c=0;c<10;c++){const n=r*10+(r%2?9-c:c)+1;const d=document.createElement('div');d.className='c'+(QT.has(n)?' q':'');d.id='c'+n;d.innerHTML=n+(QT.has(n)?'<i>?</i>':'');g.appendChild(d)}
let sv='';
for(const[a,b]of Object.entries(LAD)){const[x1,y1]=xy(+a),[x2,y2]=xy(b),dx=y2-y1,dy=x1-x2,L=Math.hypot(dx,dy),ox=dx/L*1.6,oy=dy/L*1.6;
 sv+=`<g stroke-linecap="round"><line x1="${x1-ox}" y1="${y1-oy}" x2="${x2-ox}" y2="${y2-oy}" stroke="#d9954d" stroke-width="1.3"/><line x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}" stroke="#f0b266" stroke-width="1.3"/>`;
 const m=Math.round(L/4);for(let i=1;i<m;i++){const t=i/m;sv+=`<line x1="${x1-ox+(x2-x1)*t}" y1="${y1-oy+(y2-y1)*t}" x2="${x1+ox+(x2-x1)*t}" y2="${y1+oy+(y2-y1)*t}" stroke="#f7c98a" stroke-width="1"/>`}sv+='</g>'}
const SC=['#ff4fa3','#9b7bff','#2fe0a0','#ff9c4a'];let si=0;
for(const[a,b]of Object.entries(SNK)){const[x1,y1]=xy(+a),[x2,y2]=xy(b),mx=(x1+x2)/2,my=(y1+y2)/2,k=7,cl=SC[si++%4];
 const d=`M${x1} ${y1} C${mx+k} ${y1+(my-y1)*.5} ${mx-k} ${my+(y2-my)*.3} ${x2} ${y2}`;
 sv+=`<path d="${d}" fill="none" stroke="${cl}" stroke-width="3" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1" stroke-dasharray="1.5 3" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="2.6" fill="${cl}"/><circle cx="${x1-.9}" cy="${y1-.6}" r=".7" fill="#fff"/><circle cx="${x1+.9}" cy="${y1-.6}" r=".7" fill="#fff"/><circle cx="${x1-.9}" cy="${y1-.6}" r=".3" fill="#111"/><circle cx="${x1+.9}" cy="${y1-.6}" r=".3" fill="#111"/>`}
$('ov').innerHTML=sv;
// dadu
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
$('cube').innerHTML=[1,6,2,5,3,4].map(v=>`<div class="f">${[...Array(9)].map((_,i)=>PIP[v].includes(i)?'<s></s>':'<span></span>').join('')}</div>`).join('');
const ROT={1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]};let sx=0,sy=0;
async function dice(){const v=1+Math.floor(Math.random()*6);sx+=720;sy+=720;const[rx,ry]=ROT[v];$('cube').style.transform=`rotateX(${sx+rx}deg) rotateY(${sy+ry}deg)`;for(let i=0;i<5;i++){snd(300+i*60,.08,'square');await sleep(200)}await sleep(150);return v}
const msg=t=>$('msg').textContent=t;
function ui(){$('pls').innerHTML=P.map((p,i)=>`<div class="pl ${i==turn?'on':''}"><span class="dot" style="--pc:${p.c}"></span><span class="n">${p.n}</span><span>${p.pos||'-'}</span></div>`).join('');P.forEach((p,i)=>p.el.classList.toggle('act',i==turn))}
function place(p,i){const[x,y]=xy(Math.max(p.pos,1)),o=(i-(P.length-1)/2)*1.6;p.el.style.left=(x+(p.pos?o:o-1))+'%';p.el.style.top=(p.pos?y:96)+'%'}
function showStart(){mode='start';$('qm').classList.remove('show');$('stm').classList.add('show');drawStart()}
function drawStart(){$('stm').innerHTML=`<h2>ULAR TANGGA<br>SEJARAH JEPANG</h2><div class="menu"><div class="mi ${ssel==0?'on':''}" data-k="0">START GAME</div><div class="mi ${ssel==1?'on':''}" data-k="1">PEMAIN ◀ ${sc} ▶</div></div><p class="px blink" style="font-size:8px">JOYSTICK + LEMPAR</p>`;[...$('stm').querySelectorAll('.mi')].forEach(b=>b.onclick=()=>{if(b.dataset.k==='0')start(sc);else{sc=sc>=4?2:sc+1;ssel=1;drawStart()}})}
function start(n){mOn();P=[];$('pawns').innerHTML='';for(let i=0;i<n;i++){const el=document.createElement('div');el.className='pawn';el.style.setProperty('--pc',COL[i]);el.innerHTML='<div class="sh"></div><div class="p"></div>';$('pawns').appendChild(el);P.push({n:'P'+(i+1),c:COL[i],pos:0,el})}
 turn=0;P.forEach(place);ui();$('stm').classList.remove('show');mode='play';msg('Giliran P1. Tekan LEMPAR!');snd(660,.2,'square')}
async function step(p,to){const dir=to>p.pos?1:-1;while(p.pos!==to){p.pos+=dir;p.el.classList.remove('hop');void p.el.offsetWidth;p.el.classList.add('hop');place(p,P.indexOf(p));const c=$('c'+p.pos);if(c){c.classList.add('glow');setTimeout(()=>c.classList.remove('glow'),900)}snd(dir>0?520+p.pos*3:380,.08,'triangle');ui();await sleep(300)}}
async function slide(p,to){snd(to>p.pos?880:200,.4,'sawtooth');p.pos=to;place(p,P.indexOf(p));p.el.style.transitionDuration='.9s';await sleep(950);p.el.style.transitionDuration='';ui()}
function ask(){if(!bag.length)bag=QS.map((_,i)=>i).sort(()=>Math.random()-.5);return QS[bag.pop()]}
function hl(){[...$('qo').children].forEach((e,i)=>e.classList.toggle('sel',i==qsel))}
function quiz(pts){return new Promise(res=>{const a=ask();qo=a.slice(1).map((t,i)=>({t,ok:!i})).sort(()=>Math.random()-.5);qsel=0;lock=false;qres=res;qp=pts;
 $('qb').textContent='TARUHAN: '+pts+' PETAK';$('qt').textContent=a[0];$('qr').textContent='';
 $('qo').innerHTML=qo.map((o,i)=>`<div class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${o.t}</span></div>`).join('');
 [...$('qo').children].forEach(e=>e.onclick=()=>pick(+e.dataset.i));hl();mode='quiz';$('qm').classList.add('show')})}
async function pick(i){if(lock||mode!=='quiz')return;lock=true;const ok=qo[i].ok,k=$('qo').children;k[i].classList.add(ok?'ok':'no');if(!ok)qo.forEach((o,j)=>o.ok&&k[j].classList.add('ok'));
 $('qr').textContent=ok?(qp?'BENAR! Naik '+qp+' petak.':'BENAR! Taruhan 0 petak.'):(qp?'SALAH. Mundur '+qp+' petak.':'SALAH. Untung taruhan 0.');snd(ok?784:150,.3,'square');if(ok)confetti(14);
 await sleep(1800);$('qm').classList.remove('show');mode='busy';qres(ok?qp:-qp)}
function confetti(n=60){const cs=['#ff4fa3','#27d3ff','#ffd23f','#8a6bff','#3fd9a4'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=cs[i%5];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}}
async function roll(){if(mode!=='play')return;mode='busy';const p=P[turn];msg(p.n+' melempar…');const d=await dice();msg(p.n+' dapat poin '+d+'! Jawab kuis!');await sleep(800);
 const dl=await quiz(d);
 if(dl>0){if(p.pos+dl>100){msg('Butuh angka pas untuk finis!');await sleep(900)}else await step(p,p.pos+dl)}
 else if(p.pos===0){msg('Salah, tapi masih di START. Tidak mundur.');await sleep(1200)}
 else await step(p,Math.max(0,p.pos+dl));
 if(p.pos===100)return win(p);
 if(LAD[p.pos]){msg('TANGGA! Naik ke '+LAD[p.pos]);await sleep(300);await slide(p,LAD[p.pos]);confetti(10)}
 else if(SNK[p.pos]){msg('DIGIGIT ULAR! Turun ke '+SNK[p.pos]);await sleep(300);await slide(p,SNK[p.pos])}
 turn=(turn+1)%P.length;ui();msg('Giliran '+P[turn].n+'.');mode='play'}
function win(p){ui();msg(p.n+' MENANG! Tekan START.');confetti(120);snd(988,.6,'square');mode='over'}
// kontroler
$('abcd').innerHTML='ABCD'.split('').map((l,i)=>`<button class="rb" data-i="${i}" aria-label="Jawaban ${l}">${l}</button>`).join('');
const press=i=>{if(mode==='quiz')pick(i)};
[...$('abcd').children].forEach(b=>b.onclick=()=>press(+b.dataset.i));
const ok=()=>{if(mode==='start')start(sc);else if(mode==='quiz')pick(qsel);else if(mode==='play')roll()};
$('roll').onclick=ok;$('st').onclick=()=>{if(mode!=='busy'){if(mode==='start')start(sc);else showStart()}};
function nav(d){if(mode==='quiz'&&!lock){qsel=(qsel+(d=='up'||d=='left'?-1:1)+4)%4;hl();snd(600,.05,'square')}else if(mode==='start'){if(d=='up'||d=='down')ssel=1-ssel;else sc=Math.min(4,Math.max(2,sc+(d=='left'?-1:1)));drawStart();snd(500,.05,'square')}}
let last=null;
function tilt(js,dx,dy){js.style.transform=`translateY(${dy*.3}px) rotate(${dx*1.7}deg)`;$('board').style.transform=`rotateX(${12-dy*.3}deg) rotateY(${dx*.4}deg)`}
function joy(jw){const js=jw.querySelector('.js');
 function mv(e){const r=jw.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const L=Math.hypot(dx,dy),m=r.width*.27;if(L>m){dx*=m/L;dy*=m/L}tilt(js,dx,dy);let d=null;if(Math.abs(dx)>m*.55||Math.abs(dy)>m*.55)d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');if(d&&d!==last)nav(d);last=d}
 jw.onpointerdown=e=>{jw.setPointerCapture(e.pointerId);jw.classList.add('drag');mv(e)};
 jw.onpointermove=e=>{if(jw.classList.contains('drag'))mv(e)};
 const rel=()=>{jw.classList.remove('drag');last=null;tilt(js,0,0)};jw.onpointerup=rel;jw.onpointercancel=rel}
document.querySelectorAll('.jw').forEach(joy);
addEventListener('keydown',e=>{const k=e.key;const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[k];
 if(m){e.preventDefault();nav(m);const j=document.querySelector('.js');tilt(j,m=='left'?-20:m=='right'?20:0,m=='up'?-20:m=='down'?20:0);setTimeout(()=>tilt(j,0,0),160)}
 else if(k===' '||k==='Enter'){e.preventDefault();ok()}
